name: ${COMPOSE_PROJECT_NAME:-silverpilot}

services:
  mysql:
    image: silverpilot-mysql:9.7.2
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${SILVERPILOT_MYSQL_DATABASE:-a_old}
      MYSQL_USER: ${SILVERPILOT_MYSQL_USER:-cecsms}
      MYSQL_PASSWORD: ${SILVERPILOT_DB_PASSWORD:?SILVERPILOT_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${SILVERPILOT_MYSQL_ROOT_PASSWORD:?SILVERPILOT_MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:${SILVERPILOT_MYSQL_PORT:-3307}:3306"
    volumes:
      - silverpilot-mysql-data:/var/lib/mysql
      - ./database/a_old.sql:/docker-entrypoint-initdb.d/10-cecsms.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -uroot --database=$$MYSQL_DATABASE --skip-column-names --execute='SELECT 1 FROM `user` LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 45s
    stop_grace_period: 1m
    networks: [silverpilot]

  redis:
    image: silverpilot-redis:8.2.9
    build:
      context: ./redis
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${SILVERPILOT_REDIS_PASSWORD:?SILVERPILOT_REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${SILVERPILOT_REDIS_PORT:-6380}:6379"
    volumes:
      - silverpilot-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    networks: [silverpilot]

  backend:
    profiles: [full]
    build:
      context: ./SourceCode/cecsmsServe-springboot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CECSMS_SERVER_PORT: 8083
      CECSMS_FORWARD_HEADERS_STRATEGY: native
      CECSMS_DB_URL: jdbc:mysql://mysql:3306/${SILVERPILOT_MYSQL_DATABASE:-a_old}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia%2FShanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true
      CECSMS_DB_USERNAME: ${SILVERPILOT_MYSQL_USER:-cecsms}
      CECSMS_DB_PASSWORD: ${SILVERPILOT_DB_PASSWORD:?SILVERPILOT_DB_PASSWORD is required}
      CECSMS_REDIS_ENABLED: "true"
      CECSMS_REDIS_HOST: redis
      CECSMS_REDIS_PORT: 6379
      CECSMS_REDIS_PASSWORD: ${SILVERPILOT_REDIS_PASSWORD:?SILVERPILOT_REDIS_PASSWORD is required}
      CECSMS_REDIS_HEALTH_ENABLED: "true"
      CECSMS_JWT_SECRET: ${SILVERPILOT_JWT_SECRET:?SILVERPILOT_JWT_SECRET is required}
      CECSMS_MCP_API_KEY: ${SILVERPILOT_MCP_API_KEY:?SILVERPILOT_MCP_API_KEY is required}
      CECSMS_KNOWLEDGE_BASE_PATH: /app/knowledge-base
      CECSMS_UPLOAD_DIR: /app/uploads
      CECSMS_LEGACY_ASSET_DIR: /app/repository-media
      CECSMS_CORS_ALLOWED_ORIGINS: http://127.0.0.1:${SILVERPILOT_FRONTEND_PORT:-8082},http://localhost:${SILVERPILOT_FRONTEND_PORT:-8082}
      CECSMS_AGENT_RATE_LIMIT: ${SILVERPILOT_AGENT_RATE_LIMIT:-12}
      CECSMS_CAPTCHA_TTL: ${SILVERPILOT_CAPTCHA_TTL:-5m}
      CECSMS_CAPTCHA_MAX_LOCAL_ENTRIES: ${SILVERPILOT_CAPTCHA_MAX_LOCAL_ENTRIES:-10000}
      CECSMS_AI_MOCK_ENABLED: ${SILVERPILOT_AI_MOCK_ENABLED:-false}
      DEEPSEEK_API_KEY: ${SILVERPILOT_DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${SILVERPILOT_DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_THINKING_ENABLED: ${SILVERPILOT_DEEPSEEK_THINKING_ENABLED:-false}
      DOUBAO_API_KEY: ${SILVERPILOT_DOUBAO_API_KEY:-}
      DOUBAO_MODEL: ${SILVERPILOT_DOUBAO_MODEL:-}
      CECSMS_LOG_LEVEL: ${SILVERPILOT_LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${SILVERPILOT_BACKEND_PORT:-8083}:8083"
    volumes:
      - ./knowledge-base/ima-ready:/app/knowledge-base:ro
      - silverpilot-uploads:/app/uploads
      - ./image:/app/repository-media/image:ro
      - ./file:/app/repository-media/file:ro
      - ./video:/app/repository-media/video:ro
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    stop_grace_period: 30s
    networks: [silverpilot]

  frontend:
    profiles: [full]
    build:
      context: ./SourceCode/cecsmsui-vue
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SILVERPILOT_FRONTEND_PORT:-8082}:8080"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 4s
      retries: 8
      start_period: 15s
    stop_grace_period: 15s
    networks: [silverpilot]

volumes:
  silverpilot-mysql-data:
  silverpilot-redis-data:
  silverpilot-uploads:

networks:
  silverpilot:
    driver: bridge
