name: Bug report
description: Report a reproducible defect in SilverPilot
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SilverPilot. For vulnerabilities, use the private Security reporting channel instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I removed credentials, tokens, real personal/health data, and production logs.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      options:
        - Full Docker
        - Local IDEA + VSCode
        - CI
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest deterministic sequence of commands or actions.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit SHA, OS, browser, Java/Node/Docker versions, and relevant provider mode.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Paste only sanitized logs, screenshots, or test output.
