changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
        - semver-major
    - title: Security
      labels:
        - security
    - title: Features
      labels:
        - enhancement
        - semver-minor
    - title: Fixes
      labels:
        - bug
        - semver-patch
    - title: Dependencies
      labels:
        - dependencies
    - title: Documentation and maintenance
      labels:
        - documentation
        - maintenance
    - title: Other changes
      labels:
        - "*"
