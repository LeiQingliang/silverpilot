name: Demo video page

on:
  push:
    branches: [main]
    paths:
      - docs/demo/**
      - .github/workflows/demo-pages.yml
  pull_request:
    branches: [main]
    paths:
      - docs/demo/**
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the standalone player
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          text = Path('docs/demo/index.html').read_text(encoding='utf-8')
          HTMLParser().feed(text)
          assert '<video' in text and 'controls' in text
          assert 'defaultPlaybackRate' in text and 'playbackRate' in text
          assert 'silverpilot-demo-original.mp4' in text
          assert not any(token in text for token in ['__HD_VIDEO_URL__', '__LITE_VIDEO_URL__', '__ORIGINAL_DOWNLOAD_URL__'])
          assert len(text.encode()) < 100_000
          print('Standalone player source checks passed.')
          PY
      - name: Package the player
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/demo

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the video page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

