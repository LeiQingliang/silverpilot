name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest and publish
    runs-on: windows-latest
    timeout-minutes: 70
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require stable tag at current main
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must use stable SemVer: $tag"
          }
          git fetch origin main --no-tags --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/main.' }
          $tagCommit = (git rev-parse HEAD).Trim()
          $mainCommit = (git rev-parse origin/main).Trim()
          if ($tagCommit -cne $mainCommit) {
            throw "Release tag $tag must point to current main ($mainCommit), found $tagCommit."
          }

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: SourceCode/cecsmsServe-springboot/pom.xml

      - name: Determine Dependency-Check cache generation
        id: odc-date
        shell: pwsh
        run: '"date=$((Get-Date).ToUniversalTime().ToString(''yyyy-MM-dd''))" >> $env:GITHUB_OUTPUT'

      - name: Restore persistent Dependency-Check database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dependency-check-data
          key: windows-odc-13.0.0-${{ steps.odc-date.outputs.date }}
          restore-keys: |
            windows-odc-13.0.0-

      - name: Enforce Java dependency vulnerability gate
        shell: pwsh
        run: ./scripts/invoke-dependency-check.ps1 -Mode All -UpdateTimeoutMinutes 15 -ScanTimeoutMinutes 10 -MaximumDataAgeHours 168

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: SourceCode/cecsmsui-vue/package-lock.json

      - name: Pin npm
        shell: pwsh
        run: ./scripts/install-pinned-npm.ps1

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: SourceCode/cecsmsui-vue
        run: npm ci

      - name: Verify and build release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build-release.ps1 -Tag $env:GITHUB_REF_NAME -IncludeRepositorySbom

      - name: Preserve release assets in Actions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release-artifacts/${{ github.ref_name }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Generate signed build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release-artifacts/${{ github.ref_name }}/*

      - name: Create draft, attach assets and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = Join-Path 'docs/releases' "$tag.md"
          $existingDraft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ([string]$existingDraft -cne 'true') {
              throw "Release $tag already exists and is not a draft."
            }
          } else {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --draft `
              --title "SilverPilot $tag" `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Unable to create draft release $tag." }
          }

          $assets = Get-ChildItem -LiteralPath "release-artifacts/$tag" -File | Sort-Object Name
          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Unable to upload $($asset.Name)." }
          }

          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish release $tag." }
