spring.application.name=cecsms-serve
spring.profiles.default=host
server.port=${CECSMS_SERVER_PORT:8083}
server.shutdown=graceful
server.forward-headers-strategy=${CECSMS_FORWARD_HEADERS_STRATEGY:NONE}
spring.lifecycle.timeout-per-shutdown-phase=20s

# Local MySQL 9.7 defaults. Secrets are supplied through environment variables.
spring.datasource.url=${CECSMS_DB_URL:jdbc:mysql://127.0.0.1:3306/a_old?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia%2FShanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true}
spring.datasource.username=${CECSMS_DB_USERNAME:root}
spring.datasource.password=${CECSMS_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# The source-only default stays off for isolated tests/manual configuration. Every supported launcher
# enables Redis and its health indicator; Local mode additionally gates Docker Redis 8.2.9 before Java starts.
# Bounded in-process handling remains emergency runtime protection, not a supported Local-mode topology.
agent.redis.enabled=${CECSMS_REDIS_ENABLED:false}
spring.data.redis.host=${CECSMS_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${CECSMS_REDIS_PORT:6379}
spring.data.redis.password=${CECSMS_REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.cecsmsserve.entity
mybatis-plus.configuration.map-underscore-to-camel-case=false
mybatis-plus.global-config.db-config.logic-delete-field=is_deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.global-config.db-config.id-type=auto

deepseek.api.url=${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
deepseek.api.thinking-enabled=${DEEPSEEK_THINKING_ENABLED:false}
deepseek.api.connect-timeout=5s
deepseek.api.read-timeout=60s

# Optional multimodal provider. DOUBAO_MODEL is the Volcengine Ark endpoint/model ID.
doubao.api.url=${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
doubao.api.key=${DOUBAO_API_KEY:}
doubao.api.model=${DOUBAO_MODEL:}
doubao.api.connect-timeout=5s
doubao.api.read-timeout=90s

# Agent safety: write actions expire unless explicitly confirmed; chat requests are rate limited per user.
agent.confirmation-ttl=${CECSMS_AGENT_CONFIRMATION_TTL:10m}
agent.rate-limit.per-minute=${CECSMS_AGENT_RATE_LIMIT:12}
agent.history-limit=${CECSMS_AGENT_HISTORY_LIMIT:20}
agent.knowledge-base-path=${CECSMS_KNOWLEDGE_BASE_PATH:../../knowledge-base/ima-ready}
agent.knowledge-cache-ttl=${CECSMS_KNOWLEDGE_CACHE_TTL:60s}
agent.ai.mock-enabled=${CECSMS_AI_MOCK_ENABLED:false}
agent.ai.max-completion-tokens=${CECSMS_AI_MAX_COMPLETION_TOKENS:1800}
agent.ai.max-total-tokens-per-run=${CECSMS_AI_MAX_TOTAL_TOKENS:12000}
agent.ai.max-tool-iterations=${CECSMS_AI_MAX_TOOL_ITERATIONS:8}
agent.ai.retry.max-attempts=${CECSMS_AI_RETRY_MAX_ATTEMPTS:2}
agent.ai.retry.backoff=${CECSMS_AI_RETRY_BACKOFF:350ms}

# WorkBuddy MCP is disabled until a dedicated local secret is configured.
agent.mcp.api-key=${CECSMS_MCP_API_KEY:}

app.jwt.secret=${CECSMS_JWT_SECRET:}
app.jwt.expiration=3h
app.security.migrate-legacy-passwords=${CECSMS_MIGRATE_LEGACY_PASSWORDS:true}
app.schema.migration.enabled=${CECSMS_SCHEMA_MIGRATION_ENABLED:true}
app.database-contract.enabled=${CECSMS_DATABASE_CONTRACT_ENABLED:true}
app.security.auth-rate-limit.captcha-per-five-minutes=${CECSMS_CAPTCHA_RATE_LIMIT:30}
app.security.auth-rate-limit.login-per-ten-minutes=${CECSMS_LOGIN_RATE_LIMIT:8}
app.security.captcha.ttl=${CECSMS_CAPTCHA_TTL:5m}
app.security.captcha.max-local-entries=${CECSMS_CAPTCHA_MAX_LOCAL_ENTRIES:10000}
app.cors.allowed-origins=${CECSMS_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
app.scheduling.enabled=${CECSMS_SCHEDULING_ENABLED:true}
# Upload root. The /image URL maps to its image/ child; from this module the project root is ../...
file.image-base-path=${CECSMS_UPLOAD_DIR:../..}
# Optional read-only fallback for historical/demo image, file, and video assets.
# Docker mounts the repository assets here while keeping new uploads in its named volume.
file.asset-base-path=${CECSMS_ASSET_DIR:}
# Optional second read-only root for the repository's original image/file/video directories.
file.legacy-asset-base-path=${CECSMS_LEGACY_ASSET_DIR:}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.health.defaults.enabled=true
management.health.redis.enabled=${CECSMS_REDIS_HEALTH_ENABLED:false}
management.metrics.tags.application=${spring.application.name}

logging.level.root=INFO
logging.level.com.cecsmsserve=${CECSMS_LOG_LEVEL:INFO}
logging.level.com.cecsmsserve.mapper=${CECSMS_SQL_LOG_LEVEL:WARN}
logging.pattern.level=%5p [requestId:%X{requestId:-}]
logging.file.name=logs/cecsms.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

#---
spring.config.activate.on-profile=host
# IDEA may run this Maven module either from its own directory or from the repository root.
# Import the generated host-only secrets/configuration from both supported working directories.
spring.config.import=optional:file:./config/application-host.properties,optional:file:./SourceCode/cecsmsServe-springboot/config/application-host.properties
